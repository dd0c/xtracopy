# xtracopy.conf - configuration for xtracopy.pl (must sit next to the script,
# or pass another file with -c). Format: "key = value", '#' starts a comment.

# Remote hosts. Optionally followed by a remote directory for that host;
# otherwise remote_dir is used. "user@host" works too. ssh must log in
# without a password (public key), e.g. run ssh-keygen and add the key to
# ~/.ssh/authorized_keys on every host.
host = hostB
host = hostC
host = backup@hostD /export/backup/xtracopy

# Where copies go on the remote hosts. The full source path is kept below it:
# /export/home/data/x.txt -> /var/xtracopy/export/home/data/x.txt
remote_dir = /var/xtracopy

# Minimum number of copies of every file, each on a different remote host
# (the original on this host is not counted).
copies = 2

# Files and directories to replicate (directories are copied recursively).
source = /export/home/data
source = /etc/myapp/myapp.conf

# Perl regexes matched against the full path of files and directories to skip.
exclude = /\.snapshot(/|$)
exclude = \.(tmp|swp)$

# --- Optional settings (defaults shown) ---
# state_file  = xtracopy.state      # relative to the script directory
# ssh         = /usr/bin/ssh
# scp         = /usr/bin/scp
# ssh_opts    = -o BatchMode=yes
# scp_opts    = -p -q -o BatchMode=yes
# batch_size  = 50                  # files per scp command
# remote_perl = perl                # only used by --verify
#
# scp_quote: "yes" for the classic scp protocol (Sun SSH, OpenSSH < 9), where
# the target path passes through the remote shell. Set to "no" if this host
# runs OpenSSH >= 9 (SFTP mode), or keep "yes" and add -O to scp_opts.
# scp_quote   = yes
